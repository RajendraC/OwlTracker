name: Check what Google Play holds

# Run by hand (Actions → "Check what Google Play holds" → Run workflow) to see, without changing
# anything, the store listing Google Play has saved in each language (name, descriptions, video,
# icon, feature graphic, screenshots), the contact details and every testing track's releases.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # lets GitHub prove to Google which repository is asking; no Google key is stored

# Shares the release workflow's queue: an open Google Play edit would cancel another one.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  inspect:
    name: Google Play
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check Google Play publishing is set up
        env:
          PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [ -z "$PROVIDER" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::The repository variables PLAY_WIF_PROVIDER and PLAY_SERVICE_ACCOUNT aren't set (see tools/setup-play-publishing.sh)."
            exit 1
          fi

      - name: Sign in to Google Play
        id: google
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 300s
          create_credentials_file: false

      - name: Read what Google Play holds
        env:
          PLAY_TOKEN: ${{ steps.google.outputs.access_token }}
        shell: bash
        run: bash ci/play-inspect.sh com.owl.tracker | tee -a "$GITHUB_STEP_SUMMARY"
