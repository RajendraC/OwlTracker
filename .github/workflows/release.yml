name: Release bundle for Google Play

# Run by hand: Actions -> "Release bundle for Google Play" -> Run workflow.
# Builds the signed .aab that Google Play needs, using the upload key stored in repository secrets,
# and (once tools/setup-play-publishing.sh has been run) sends it to a Google Play testing track.
# Production is never automatic: promote a tested release in Play Console.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name users will see, e.g. 1.0.0"
        required: true
        default: "1.0.0"
      play_track:
        description: "Send to Google Play: internal = Internal testing, alpha = Closed testing, none = just build"
        type: choice
        options: [internal, alpha, none]
        default: internal

permissions:
  contents: read
  id-token: write # lets GitHub prove to Google which repository is asking; no Google key is stored

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    name: Signed release bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Open-source cache on GitHub (as in v4), not Gradle's proprietary "enhanced" service
          cache-provider: basic
          # Every workflow shares one cache entry, keyed on the build files. Only "Build and test"
          # saves it (it downloads everything); this workflow just restores it.
          cache-read-only: true

      - name: Check the four signing secrets are set
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: |
          missing=""
          for v in UPLOAD_KEYSTORE_BASE64 UPLOAD_KEYSTORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Restore the upload key
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload.jks"
          [ -s "$RUNNER_TEMP/upload.jks" ] || { echo "::error::UPLOAD_KEYSTORE_BASE64 did not decode to a file"; exit 1; }
          echo "OWL_TRACKER_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"

      # Opens the key file and finds and unlocks the key before Gradle runs. Stray spaces, line breaks
      # or quotes in the secrets are ignored; a key with a different name (e.g. Android Studio's
      # "key0") is used if it's the only one, with a warning. Anything else stops here with a
      # message naming the secret to fix. The working values go to the build step via GITHUB_ENV.
      - name: Check the upload key
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        shell: bash
        run: java ci/CheckUploadKey.java

      - name: Build the signed app bundle
        env:
          OWL_TRACKER_KEYSTORE: ${{ runner.temp }}/upload.jks
          OWL_TRACKER_VERSION_NAME: ${{ inputs.version_name }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Check the bundle and describe it
        shell: bash
        run: bash ci/describe-bundle.sh app/build/outputs/bundle/release/app-release.aab "${{ inputs.version_name }}" "$OWL_TRACKER_VERSION_CODE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Name the file for upload
        shell: bash
        run: |
          mkdir -p out
          cp app/build/outputs/bundle/release/app-release.aab "out/owl-tracker-${{ inputs.version_name }}-${OWL_TRACKER_VERSION_CODE}.aab"

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: owl-tracker-aab-${{ inputs.version_name }}
          path: out/*.aab
          retention-days: 30
          if-no-files-found: error

      - name: Check Google Play publishing is set up
        id: play
        if: inputs.play_track != 'none'
        env:
          PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
        shell: bash
        run: |
          if [ -n "$PROVIDER" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Not sent to Google Play: the repository variables PLAY_WIF_PROVIDER and PLAY_SERVICE_ACCOUNT aren't set (see tools/setup-play-publishing.sh). Download the bundle above and upload it in Play Console."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # Workload Identity Federation: Google trusts GitHub's short-lived token for this repository's
      # main branch only, and hands back a 15-minute token for the Play publishing account.
      - name: Sign in to Google Play
        id: google
        if: steps.play.outputs.ready == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.PLAY_WIF_PROVIDER }}
          service_account: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          access_token_lifetime: 900s
          create_credentials_file: false

      - name: Send to Google Play (${{ inputs.play_track }})
        if: steps.play.outputs.ready == 'true'
        env:
          PLAY_TOKEN: ${{ steps.google.outputs.access_token }}
          VERSION_NAME: ${{ inputs.version_name }}
          TRACK: ${{ inputs.play_track }}
        shell: bash
        run: bash ci/play-upload.sh com.owl.tracker "out/owl-tracker-${VERSION_NAME}-${OWL_TRACKER_VERSION_CODE}.aab" "$TRACK" "$VERSION_NAME" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Remove the upload key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
